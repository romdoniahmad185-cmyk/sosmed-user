<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f3f4f6;

    color:#111827;

    padding-bottom:82px;

    overflow-x:hidden;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:62px;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    background:
        rgba(255,255,255,.96);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid #e5e7eb;
}


.logo{

    font-size:21px;

    font-weight:900;

    letter-spacing:-.5px;
}


.logo span{
    color:#2563eb;
}


.header-actions{

    display:flex;

    align-items:center;

    gap:8px;
}


.header-btn{

    width:38px;
    height:38px;

    border:0;

    border-radius:50%;

    background:#f3f4f6;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;

    cursor:pointer;

    position:relative;
}


.chat-badge{

    position:absolute;

    right:-2px;
    top:-2px;

    min-width:17px;

    padding:0 4px;

    background:#ef4444;

    color:white;

    border-radius:20px;

}


/* =====================================================
   MAIN
===================================================== */

.main{

    width:100%;

    max-width:760px;

    margin:auto;

    padding:

}


/* =====================================================
   CREATOR PROFILE
===================================================== */

.creator-profile{

    background:white;

    border-radius:20px;

    padding:18px;

    display:flex;

    align-items:center;

    gap:14px;

    box-shadow:
        0 4px 18px

}


.creator-avatar-large{

    width:65px;
    height:65px;

    flex-shrink:0;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #111827,
            #4b5563
        );

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:25px;

    font-weight:900;
}


.creator-info{
    flex:1;
}


.creator-info h2{

    font-size:20px;

    font-weight:900;
}


.creator-info p{

    font-size:12px;

    color:#6b7280;

    margin-top:4px;
}


.creator-stats{

    display:flex;

    gap:15px;

    margin-top:9px;
}


.stat{

    font-size:12px;

    color:#6b7280;
}


.stat strong{

    color:#111827;

    font-size:14px;
}


.follow-main{

    border:0;

    background:#2563eb;

    color:white;

    padding:
        9px 14px;

    border-radius:10px;

    font-weight:800;

    cursor:pointer;
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:22px;

    margin-bottom:12px;
}


.section-title h1{

    font-size:23px;

    font-weight:900;
}


.section-title span{

    color:#6b7280;

    font-size:12px;
}


/* =====================================================
   CONTENT NAV
===================================================== */

.content-nav{

    display:flex;

    gap:8px;

    overflow-x:auto;

    scrollbar-width:none;

    margin-bottom:12px;
}


.content-nav::-webkit-scrollbar{
    display:none;
}


.content-tab{

    flex-shrink:0;

    border:0;

    background:white;

    color:#6b7280;

    padding:
        10px 16px;

    border-radius:25px;

    font-weight:800;

    cursor:pointer;
}


.content-tab.active{

    background:#2563eb;

    color:white;
}


/* =====================================================
   COLLECTION GRID
===================================================== */

.collection-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;
}


.collection-item{

    background:#111;

    border-radius:15px;

    overflow:hidden;

    aspect-ratio:1/1;

    position:relative;

    cursor:pointer;
}


.collection-item img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


.collection-overlay{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:
        35px 10px 10px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.85)
        );

    color:white;
}


.collection-type{

    font-size:11px;

    opacity:.8;
}


.collection-title{

    font-size:13px;

    font-weight:800;

    margin-top:3px;
}


.video-mark{

    position:absolute;

    top:9px;
    right:9px;

    width:32px;
    height:32px;

    border-radius:50%;

    background:
        rgba(0,0,0,.65);

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:14px;
}


/* =====================================================
   SOCIAL COLLECTION
===================================================== */

.social-list{

    display:flex;

    flex-direction:column;

    gap:12px;
}


.social-card{

    background:white;

    border-radius:17px;

    overflow:hidden;

    box-shadow:
        0 4px 16px
        rgba(0,0,0,.06);
}


.social-header{

    padding:13px;

    display:flex;

    align-items:center;

    gap:10px;
}


.social-avatar{

    width:38px;
    height:38px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:900;
}


.social-title{

    font-size:14px;

    font-weight:800;
}


.social-platform{

    font-size:11px;

    color:#6b7280;

    margin-top:3px;
}


.social-media{

    width:100%;

    aspect-ratio:16/9;

    background:#000;

    position:relative;
}


.social-media.vertical{

    width:min(
        100%,
        430px
    );

    aspect-ratio:9/16;

    margin:auto;
}


.social-media img{

    width:100%;
    height:100%;

    object-fit:cover;
}


.social-play{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:62px;
    height:45px;

    border-radius:13px;

    background:
        rgba(0,0,0,.65);

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:22px;
}


.social-actions{

    display:flex;

    gap:8px;

    padding:10px 13px;
}


.social-action{

    border:0;

    background:#f3f4f6;

    padding:
        8px 12px;

    border-radius:20px;

    font-size:13px;

    cursor:pointer;
}


/* =====================================================
   FULLSCREEN VIEWER
===================================================== */

.viewer{

    position:fixed;

    inset:0;

    z-index:3000;

    background:#000;

    display:none;
}


.viewer.open{

    display:flex;

    align-items:center;

    justify-content:center;
}


.viewer-close{

    position:absolute;

    left:15px;
    top:15px;

    z-index:20;

    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:
        rgba(0,0,0,.55);

    color:white;

    font-size:22px;
}


.viewer-image{

    max-width:100%;

    max-height:100%;

    object-fit:contain;
}


.viewer-video{

    width:100%;

    aspect-ratio:16/9;

    border:0;
}


/* =====================================================
   TIKTOK MODE
===================================================== */

.tiktok-mode{

    position:fixed;

    inset:0;

    z-index:3500;

    background:#000;

    display:none;
}


.tiktok-mode.open{

    display:block;
}


.tiktok-scroll{

    width:100%;
    height:100%;

    overflow-y:auto;

    scroll-snap-type:y mandatory;

    scrollbar-width:none;
}


.tiktok-scroll::-webkit-scrollbar{
    display:none;
}


.tiktok-page{

    width:100%;
    height:100vh;

    scroll-snap-align:start;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#000;
}


.tiktok-content{

    height:100%;

    aspect-ratio:9/16;

    max-width:100%;

    background:
        linear-gradient(
            135deg,
            #111827,
            #000
        );

    color:white;

    display:flex;

    align-items:center;

}


.tiktok-side{

    position:absolute;

    right:12px;

    bottom:110px;

    display:flex;

    flex-direction:column;

    gap:15px;

    color:white;
}


.tiktok-btn{

    border:0;

    background:none;

    color:white;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:3px;

    cursor:pointer;
}


.tiktok-btn-icon{

    width:44px;
    height:44px;

    border-radius:50%;

    background:
        rgba(0,0,0,.55);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:21px;
}


.tiktok-info{

    position:absolute;

    left:14px;
    right:75px;

    bottom:28px;

    color:white;
}


.tiktok-info strong{

    font-size:17px;
}


.tiktok-info p{

    font-size:13px;

    margin-top:7px;

    line-height:1.4;
}


.tiktok-follow{

    border:0;

    margin-left:8px;

    padding:
        6px 12px;

    border-radius:7px;

    font-weight:800;
}


/* =====================================================
   CHAT
===================================================== */

.chat{

    position:fixed;

    inset:0;

    z-index:5000;

    background:white;

    display:none;

    flex-direction:column;
}


.chat.open{
    display:flex;
}


.chat-header{

    height:62px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:0 14px;

    border-bottom:
        1px solid #e5e7eb;
}


.chat-back{

    width:38px;
    height:38px;

    border:0;

    border-radius:50%;

    background:#f3f4f6;

    font-size:20px;
}


.chat-messages{

    flex:1;

    overflow-y:auto;

    padding:15px;

    background:#f8fafc;
}


.message{

    max-width:78%;

    padding:

    margin-bottom:10px;

    border-radius:15px;

    font-size:14px;
}


.message.viewer{

    margin-left:auto;

    background:#2563eb;

    color:white;
}


.message.creator{

    background:white;

    border:
        1px solid #e5e7eb;
}


.chat-input{

    display:flex;

    gap:8px;

    padding:10px;

    border-top:
        1px solid #e5e7eb;
}


.chat-input input{

    flex:1;

    border:0;

    outline:0;

    background:#f3f4f6;

    padding:
        12px 14px;

    border-radius:25px;
}


.chat-input button{

    width:45px;

    border:0;

    border-radius:50%;

    background:#2563eb;

    color:white;

    font-size:18px;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:70px;

    z-index:1000;

    background:
        rgba(255,255,255,.97);

    backdrop-filter:
        blur(18px);

    border-top:
        1px solid #e5e7eb;

    display:flex;

    align-items:center;

    justify-content:space-around;
}


.nav{

    background:none;

    color:#6b7280;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:4px;

    font-size:10px;

    cursor:pointer;
}


.nav-icon{
    font-size:22px;
}


.nav.active{
    color:#2563eb;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{

    text-align:center;

    padding:60px 20px;

    color:#9ca3af;
}


@media(max-width:430px){

    .collection-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .creator-profile{
        padding:14px;
    }

}

</style>
</head>

<script>

/* =====================================================
   DATA KOLEKSI CREATOR
===================================================== */

const collection = [

    {
        id:1,

        type:"photo",

        title:"Perjalanan",

        image:
        "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
    },


    {
        id:2,

        type:"photo",

        title:"Suasana sore",

        image:

    },


    {
        id:3,

        type:"video",

        title:"Video perjalanan",

        image:
        "https://images.unsplash.com/photo-1485846234645-a62644f84728"
    },


    {
        id:4,

        type:"video",

        title:"Behind the scene",

        image:
        "https://images.unsplash.com/photo-1492724441997-5dc865305da7"
    },


    {
        id:5,

        type:"photo",

        title:"Momen Creator",

        image:
        "https://images.unsplash.com/photo-1500534623283-312aade485b7"
    },


    {
        id:6,

        type:"video",

        title:"Project terbaru",

        image:
        "https://images.unsplash.com/photo-1492619375914-88005aa9e8fb"
    }

];



/* =====================================================
   SOCIAL POSTS
===================================================== */

const socialPosts = [

    {
        id:1,

        platform:"YouTube",

        type:"youtube",

        title:
        "Video terbaru Creator",

        link:
        "https://www.youtube.com/watch?v=dQw4w9WgXcQ",

        likes:1200
    },


    {
        id:2,

        platform:"TikTok",

        type:"tiktok",

        title:
        "Video pendek Creator",

        likes:820
    },


    {
        id:3,

        platform:"Instagram",

        type:"instagram",

        title:
        "Instagram Reel Creator",

        likes:530
    }

];



/* =====================================================
   COLLECTION RENDER
===================================================== */

function showCollection(
    type="all",
    button=null
){

    if(button){

        document
            .querySelectorAll(
                ".content-tab"
            )
            .forEach(
                b =>
                b.classList.remove(
                    "active"
                )
            );

        button.classList.add(
            "active"
        );

    }


    let data =
        collection;


    if(type!=="all"){

        data =
            collection.filter(
                item =>
                item.type === type
            );

    }


    const grid =
        document.getElementById(
            "collectionGrid"
        );


    if(!data.length){

        grid.innerHTML = `
            <div class="empty">
                Belum ada koleksi.
            </div>
        `;

        return;

    }


    grid.innerHTML =

        data.map(
            item => `

                <article
                    class="
                        collection-item
                    "
                    onclick="
                        openCollection(
                            ${item.id}
                        )
                    "
                >

                    <img
                        src="${item.image}"
                        alt="${item.title}"
                    >


                    ${
                        item.type ===
                        "video"

                        ?

                        `
                        <div
                            class="video-mark"
                        >
                            ▶
                        </div>
                        `

                        :

                        ""
                    }


                    <div
                        class="
                            collection-overlay
                        "
                    >

                        <div
                            class="
                                collection-type
                            "
                        >

                            ${
                                item.type ===
                                "video"
                                ? "VIDEO"
                                : "FOTO"
                            }

                        </div>


                        <div
                            class="
                                collection-title
                            "
                        >

                            ${item.title}

                        </div>

                    </div>

                </article>

            `
        )
        .join("");

}



/* =====================================================
   OPEN COLLECTION
===================================================== */

function openCollection(id){

    const item =
        collection.find(
            x => x.id === id

/* =====================================================
   YOUTUBE
===================================================== */

function getYoutubeId(url){

    try{

        const u =
            new URL(url);

        if(
            u.hostname.includes(
                "youtu.be"
            )
        ){

            return u.pathname
                .substring(1);

        }

        return u.searchParams
            .get("v");

    }

    catch{

        return "";

    }

}


function openYouTube(id){

    document
        .getElementById(
            "viewerContent"
        )
        .innerHTML = `

            <iframe
                class="viewer-video"
                src="
                https://www.youtube.com/embed/${id}?autoplay=1
                "
                allow="
                    autoplay;
                    fullscreen;
                    encrypted-media
                "
                allowfullscreen
            ></iframe>

        `;


    document
        .getElementById(
            "viewer"
        )
        .classList
        .add("open");

}

let messages = [

    {
        sender:"creator",
        text:
        "Halo 👋 Selamat datang di koleksi saya."
    },

    {
        sender:"viewer",
        text:
        "Halo Creator!"
    },

    {
        sender:"creator",
        text:
        "Silakan lihat koleksi saya."
    }

];


function openChat(){

    document
        .getElementById(
            "chat"
        )
        .classList
        .add("open");


    renderChat();

}


function closeChat(){

    document
        .getElementById(
            "chat"
        )
        .classList
        .remove("open");

}


function renderChat(){

    const container =
        document.getElementById(
            "chatMessages"
        );


    container.innerHTML =

        messages
        .map(
            message => `

                <div
                    class="
                        message
                        ${message.sender}
                    "
                >

                    ${
                        message.sender ===
                        "creator"
                        ? "<small>Creator</small><br>"
                        : ""
                    }

                    ${message.text}

                </div>

            `
        )
        .join("");


    container.scrollTop =
        container.scrollHeight;

}


function sendChat(){

    const input =
        document.getElementById(
            "chatInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    messages.push({

        sender:"viewer",

        text:text

    });


    input.value="";


    renderChat();


    setTimeout(
        () => {

            messages.push({

                sender:"creator",

                text:
                "Pesan kamu sudah saya terima 👍"

            });


            renderChat();

        },
        1000
    );

}
